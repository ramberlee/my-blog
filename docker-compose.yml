services:
  blog:
    build: .
    container_name: my-blog
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - blog-data:/app/server/data
      - blog-uploads:/app/server/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SESSION_EXPIRY_HOURS=24
      - MAX_UPLOAD_SIZE_MB=5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  blog-data:
    driver: local
  blog-uploads:
    driver: local
